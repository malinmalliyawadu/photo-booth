# The booth on Coolify: Postgres, the worker and the app as one
# resource. The kiosk runs on the internet; the iPad opens the app's
# domain in Safari. Coolify's proxy terminates TLS with a real
# certificate, so Safari grants the camera with no private CA to install.
#
# In Coolify: Build Pack "Docker Compose", Base Directory "/",
# Docker Compose Location "/docker-compose.coolify.yml". Give the
# `booth` service a domain with its port, e.g.
# https://booth.example.com:3100, and set ADMIN_PASSWORD.
# SERVICE_PASSWORD_POSTGRES is generated by Coolify.
#
# The worker applies the migrations and loads the layouts in
# templates/ on start; the app waits for it to report healthy.
#
# Locally, on http://localhost:3100:
#   SERVICE_PASSWORD_POSTGRES=booth ADMIN_PASSWORD=secret docker compose \
#     -f docker-compose.coolify.yml -f ops/compose.local.yml -p booth-cloud up --build
#
# There is no USB here: set the camera to "iPad" on /admin, and the
# printer stays fake until printing has somewhere to run.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: booth
    volumes:
      - booth-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://booth:${SERVICE_PASSWORD_POSTGRES}@db:5432/booth
      BOOTH_PRINTER: fake
    volumes:
      - booth-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  booth:
    build:
      context: .
      dockerfile: apps/booth/Dockerfile
    environment:
      DATABASE_URL: postgres://booth:${SERVICE_PASSWORD_POSTGRES}@db:5432/booth
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      # Where the QR code points. The gallery's domain once it serves
      # /s/{id} (phase 5); until then any URL you like.
      GALLERY_ORIGIN: ${GALLERY_ORIGIN:-}
    volumes:
      - booth-data:/data
    # The worker applies the migrations and the seed before it reports
    # healthy, so the app never sees an old schema.
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  booth-pg:
  booth-data:
